  <path d="M 176 344 L 150 374" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>

  <!-- VALE WORDMARK -->
  <line x1="65" y1="387" x2="235" y2="387" stroke="#fff" stroke-width="1.5"/>
  <text
